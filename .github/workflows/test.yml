name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wmd
          POSTGRES_PASSWORD: wmd
          POSTGRES_DB: wmd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wmd" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://wmd:wmd@localhost:5432/wmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
